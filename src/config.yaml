project:
  name: dasigt
  seed: 7
  datasets:
  - BLCA
  - BRCA
  - UCEC
  - GBMLGG
  - LUAD
  output_root: outputs
  real_use_data_root: real_use_data
  summary_data_process: summary_table/data_process
  summary_analysis: summary_table/analysis
  device: cuda:0
  num_workers: 0
paths:
  raw_root: /PATH/TO/RAW_DATA
  image_dir: image_path
  text_dir: sent_path
  gene_expression_dir: mrna_path
  gene2vec_file: gene2vec_path/gene2vec.txt
  clinical_dir: clinical_path
  split_root: /PATH/TO/SPLITS
  split_pattern: tcga_{dataset_lower}/splits_{fold}.csv
  gene_id_map_file: ''
features:
  image_dim: 512
  text_dim: 512
  gene2vec_dim: 200
  feature_pooling: mean
  max_image_tokens: 2048
  max_text_tokens: 512
  gene_id_separator: '|'
  gene_selection: variance
  top_gene_num: 5000
  gene_cluster_num: 50
  gene_temperature: 0.5
  gene_center_init: kmeans
  gene_kmeans_n_init: 10
  gene_kmeans_max_iter: 300
  gene_kmeans_random_state: 7
  gene_power_steps: 8
  gene_epsilon: 1.0e-08
  gene_center_svd: false
survival:
  time_bins: 4
  time_unit: days
  clinical_id_col: ''
  event_col: vital_status
  event_positive_values:
  - 1
  - '1'
  - dead
  - Dead
  - DEAD
  - deceased
  - Deceased
  time_col: ''
  death_time_col: days_to_death
  censor_time_col: days_to_last_followup
  fit_cutpoints_on_train_events_only: true
model:
  name: dasigt
  hidden_dim: 512
  attention_heads: 8
  attention_dropout: 0.1
  dropout: 0.25
  num_experts: 4
  routing_temperature: 1.0
  routing_gumbel: true
  routing_straight_through: true
  routing_eval: argmax
  lambda_gene: 10.0
  lambda_gmi_compact: 0.01
  lambda_gmi_balance: 0.01
  ablation: none
training:
  folds:
  - 0
  - 1
  - 2
  - 3
  - 4
  max_epochs: 50
  patience: 10
  batch_size: 2
  gradient_accumulation_steps: 1
  pin_memory: true
  optimizer: adamw
  learning_rate: 0.0002
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  use_amp: false
  monitor: val_cindex
  save_predictions: true
  allow_val_test_overlap: true
  debug_gradient_tracking: false
  debug_gradient_path_check: false
  debug_gradient_every_n_steps: 1
ablation:
  variants:
  - none
  - no_gene_loss
  - no_gene_prior
  - fixed_trifusion
  - no_modality_gate
  - no_expert_gate
  - expert1_only
  - expert2_only
  - expert3_only
  - expert4_only
  - no_gene
  - no_report
analysis:
  export_gene_module_weights: true
  export_route_logits: true
  export_patient_predictions: true
  route_entropy: true
  pathway_top_genes: 50
  enrichment_tool: toppfun_api
  enrichment_background: all_category_genes
  toppfun:
    enabled: false
    endpoint: https://toppgene.cchmc.org/API
    categories:
    - GeneOntologyBiologicalProcess
    - GeneOntologyMolecularFunction
    - GeneOntologyCellularComponent
    - Pathway
    correction: Bonferroni
    pvalue: 0.05
    significance_qvalue: 0.05
    min_genes: 1
    max_genes: 1500
    max_results: 100
    top_genes_per_module: 50
    max_modules_per_fold: 0
    variants:
    - none
    background: all_category_genes
    lookup_batch_size: 250
    request_interval_seconds: 0.2
    timeout_seconds: 120
    retries: 3
    use_cache: true
    execution_mode: disabled
